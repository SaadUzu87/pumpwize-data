name: Agrégation des prix

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 minutes (heure UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Agréger les sources
        env:
          PUMPWIZE_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          python -s -m aggregator.run --out site/data
          cp aggregator/site_index.html site/index.html
          ls -la site/data
      # Pages doit être activé une fois dans Settings > Pages (source : GitHub Actions).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
