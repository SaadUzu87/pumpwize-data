name: Agrégation des prix

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 minutes (heure UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Agréger les sources
        env:
          PUMPWIZE_PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          python -s -m aggregator.run --out site/data
          cp aggregator/site_index.html site/index.html
          ls -la site/data
      # Pages doit être activé une fois dans Settings > Pages (source : GitHub Actions).
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Publication. GitHub met parfois quelques secondes à rendre visible
      # le paquet tout juste envoyé : demandée trop tôt, la publication
      # échoue avec « No artifacts named github-pages were found » alors que
      # la collecte a réussi. On attend donc un peu, puis on réessaie
      # au plus deux fois avant de déclarer un échec.
      - name: Laisser le paquet devenir visible
        run: sleep 10
      - id: deployment
        name: Publier (essai 1)
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Attendre avant le deuxième essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        name: Publier (essai 2)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Attendre avant le troisième essai
        if: steps.deployment2.outcome == 'failure'
        run: sleep 90
      - id: deployment3
        name: Publier (essai 3)
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
